name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run Pint (dirty check)
        run: vendor/bin/pint --test app tests config database routes

  tests:
    name: PHPUnit (MariaDB)
    runs-on: ubuntu-latest
    needs: pint

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: stores_laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_LEGACY_DATABASE: stores
      FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
      APP_KEY: base64:62YXvCqH3MeWjJ1tRTHWNLMO4cKWUTInGa88o/nn9RU=

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip, openssl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Guard fixture key length
        run: |
          echo "Fixture bytes: $(wc -c < database/fixtures/legacy-stores.sql.gz.enc)"
          if [ "${#FIXTURE_KEY}" -ne 48 ]; then
            echo "::warning::FIXTURE_KEY is ${#FIXTURE_KEY} chars (expected 48) - check the secret value"
          fi

      - name: Restore legacy fixture + prepare databases
        run: php tests/support/ci_fixture_restore.php

      - name: Run the test suite
        run: php artisan test --display-warnings

      - name: Diagnostic — raw phpunit warning text
        run: vendor/bin/phpunit tests/Feature/Phase1PipelineTest.php 2>&1 | head -60
